<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعدي - بوت الشات</title>
<style>
  :root {
    --bg: #14171c;
    --panel-2: #21262e;
    --accent: #5eead4;
    --text: #eef1f5;
    --text-dim: #8a93a3;
    --user-bubble: #2dd4bf;
    --bot-bubble: #262c35;
    --border: #2a303a;
    --error: #f87171;
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #22c1b3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 16px;
    margin: 0;
  }

  header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    margin-left: 6px;
  }

  #chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 14.5px;
    animation: pop .18s ease;
    white-space: pre-wrap;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-start;
    background: var(--user-bubble);
    color: #06231f;
    border-bottom-left-radius: 4px;
  }

  .msg.bot {
    align-self: flex-end;
    background: var(--bot-bubble);
    color: var(--text);
    border-bottom-right-radius: 4px;
  }

  .msg.error {
    align-self: flex-end;
    background: #3a1f1f;
    color: var(--error);
    border: 1px solid #5c2a2a;
  }

  .msg.typing {
    align-self: flex-end;
    background: var(--bot-bubble);
    color: var(--text-dim);
    display: flex;
    gap: 4px;
    padding: 14px 16px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: .3; }
    40% { opacity: 1; }
  }

  #chat-form {
    display: flex;
    gap: 10px;
    padding: 16px 20px 22px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  #input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14.5px;
    outline: none;
    resize: none;
    font-family: inherit;
    max-height: 120px;
  }

  #input:focus {
    border-color: var(--accent);
  }

  button {
    background: var(--accent);
    color: #06231f;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity .15s;
  }

  button:hover { opacity: .85; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="avatar">🤖</div>
    <div>
      <h1>مساعدي<span class="status-dot"></span></h1>
      <p>مربوط بذكاء اصطناعي حقيقي</p>
    </div>
  </header>

  <div id="chat"></div>

  <div id="chat-form">
    <textarea id="input" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
    <button id="send-btn" type="button" onclick="handleSend()">إرسال</button>
  </div>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');

  let conversationHistory = [];
  let isSending = false;

  addMessage('bot', 'هلا فيك! أنا مساعدك الذكي، جاهز أساعدك بأي شي تحتاجه. اكتب سؤالك وخلنا نبدأ 🙌');

  async function handleSend() {
    if (isSending) return;

    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    input.value = '';
    setSending(true);
    showTyping();

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          history: conversationHistory,
        }),
      });

      const data = await response.json();
      hideTyping();

      if (!response.ok) {
        addMessage('error', data.error || 'صار خطأ، حاول مرة ثانية.');
        return;
      }

      addMessage('bot', data.reply);

      conversationHistory.push({ role: 'user', content: text });
      conversationHistory.push({ role: 'assistant', content: data.reply });

    } catch (err) {
      hideTyping();
      addMessage('error', 'ما قدرت أوصل للخادم. تأكد من اتصالك بالإنترنت وحاول مرة ثانية.');
    } finally {
      setSending(false);
    }
  }

  function setSending(state) {
    isSending = state;
    sendBtn.disabled = state;
    sendBtn.textContent = state ? '...' : 'إرسال';
  }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.id = 'typing-indicator';
    div.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }
</script>

</body>
  </html>
